{% extends "base.html" %}

{% block title %}Inicio | {{ super() }}{% endblock title %}

{% block content %}
<!-- Main Content -->
<div class="min-h-screen bg-gradient-to-br from-gray-50 via-blue-50 to-gray-100 flex items-center justify-center">
    <div class="text-center">
        <h1 class="text-5xl font-bold bg-gradient-to-r from-gray-700 to-blue-600 bg-clip-text text-transparent mb-4">
            Bienvenido
        </h1>
        <p class="text-gray-500 text-lg mb-8">Selecciona una opción del menú para comenzar</p>
        <a href="/images" 
           class="inline-block py-3 px-8 rounded-xl font-medium text-white
                  bg-gradient-to-r from-gray-600 to-blue-600
                  hover:from-gray-700 hover:to-blue-700
                  transform transition-all duration-200 hover:scale-105
                  shadow-lg shadow-blue-200">
            Analizar Imagen
        </a>
    </div>
</div>
{% endblock content %}
